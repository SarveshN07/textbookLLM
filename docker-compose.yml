services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: textbook-postgres
    environment:
      POSTGRES_DB: textbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - textbook_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d textbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  textbook_pg_data: